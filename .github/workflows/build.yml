name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev build-essential ccache
          pip install --upgrade pip
          pip install buildozer "cython<3" virtualenv setuptools
      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          grep -n -i -E "command failed|traceback|error:|fatal" build.log | tail -n 25 || true
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
